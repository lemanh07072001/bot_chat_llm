# Reverse proxy for Chat Center.
#
# Two names, because the admin panel has its own routes under /api/ (the
# ws-ticket endpoint among them) which would be shadowed by the backend if both
# shared one hostname:
#
#   APP_DOMAIN  -> admin panel (Next.js)
#   API_DOMAIN  -> api, websocket and the widget bundle
#
# Replace APP_DOMAIN and API_DOMAIN throughout before the first deploy:
#   sed -i 's/APP_DOMAIN/app.example.com/g; s/API_DOMAIN/api.example.com/g' docker/nginx.conf

upstream chat_realtime {
    server realtime:3003;
    keepalive 32;
}

upstream chat_api {
    server api:3002;
    keepalive 32;
}

upstream chat_admin {
    server admin:3000;
    keepalive 32;
}

# Lets a websocket upgrade through while leaving plain requests alone.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The widget bundle is the only thing worth caching here: it is the same bytes
# for every visitor of every customer site.
proxy_cache_path /var/cache/nginx/widget levels=1:2 keys_zone=widget_cache:10m
                 max_size=200m inactive=7d use_temp_path=off;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types application/javascript text/javascript application/json text/css text/plain image/svg+xml;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Keeps the real visitor origin intact: the api decides per site which origins
# may embed the widget, and rewriting this header would break that check.
proxy_set_header Origin $http_origin;

server_tokens off;

# ---------------------------------------------------------------------------
# Plain http: certificate renewal, everything else redirected
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name APP_DOMAIN API_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Admin panel
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name APP_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/APP_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/APP_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    # The panel is for staff only and is never meant to be framed.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 2m;

    location /_next/static/ {
        proxy_pass http://chat_admin;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://chat_admin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# ---------------------------------------------------------------------------
# API, websocket and widget bundle
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name API_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/APP_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/APP_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2m;

    # The embed snippet points here. Served from cache so a spike of page views
    # on a customer site never reaches the api.
    location ~ ^/(widget\.js|v1/widget\.(js|mjs))$ {
        proxy_pass http://chat_api;

        proxy_cache widget_cache;
        proxy_cache_key "$host$request_uri";
        # Honours the api's own Cache-Control; this is the ceiling, not an
        # override, and a stale copy keeps being served while it refreshes.
        proxy_cache_valid 200 5m;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Socket.io starts as an http poll and upgrades; a short read timeout here
    # would cut live conversations off mid-idle.
    location /socket.io/ {
        proxy_pass http://chat_realtime;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://chat_api;
        proxy_read_timeout 60s;
    }

    # Probed by uptime monitoring; answers 503 while the database is down.
    location = /api/health {
        proxy_pass http://chat_api;
        access_log off;
    }

    location / {
        return 404;
    }
}
